<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Matemático interactivo</title>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>
    <header>
        <h1>Quiz Matemático</h1>
    </header>

    <main id="app-container">
        <section id="input-section">
            <h2>Ingresa un problema</h2>
            <p>Escribe tu ecuación, integral o función en formato LaTeX.</p>
            <textarea id="math-input" placeholder="\int x^2 dx"></textarea>
            <button id="analyze-btn">Analizar Problema</button>
            <div id="latex-preview" class="latex-render"></div>
        </section>

        <section id="quiz-section" style="display: none;">
            <h2>¿Cuál es el siguiente paso correcto?</h2>
            <div id="quiz-expression" class="latex-render"></div>
            <div id="options-container">
                <!-- Las opciones se generarán dinámicamente aquí -->
            </div>
        </section>
    </main>

    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script type="module" src="../src/app.js"></script>
</body>
</html>
