<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Matemático - Resolución Paso a Paso</title>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Quiz Matemático Interactivo</h1>
        <p>Aprende a identificar el siguiente paso</p>
    </header>

    <main id="app-container">
        <!-- Input section -->
        <section id="input-section" class="card">
            <h2>1. Ingresa tu problema</h2>
            <p>Escribe la ecuación o integral (en formato LaTeX):</p>
            <textarea id="math-input" placeholder="\int x^2 dx"></textarea>
            
            <div class="preview-container">
                <p>Vista previa:</p>
                <div id="latex-preview" class="latex-render"></div>
            </div>
            
            <button id="start-quiz-btn" class="primary-btn">Comenzar Quiz</button>
        </section>

        <!-- Quiz section (Hidden initially) -->
        <section id="quiz-section" class="card" style="display: none;">
            <h2>2. ¿Cuál es la fórmula o método a aplicar?</h2>
            <div class="problem-display">
                <div id="quiz-expression" class="latex-render"></div>
            </div>
            
            <div id="options-container" class="options-grid">
                <!-- Buttons will be generated via JS -->
            </div>
            
            <button id="reset-btn" class="secondary-btn" style="margin-top: 20px;">Probar otro problema</button>
        </section>
    </main>

    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
